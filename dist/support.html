<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Official Chimpi app versions, downloads and security support date">
  <title>Apps and support</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d1724;color:#e4edf8;font:17px/1.6 system-ui}main{max-width:1100px;margin:auto;padding:48px 24px}h1{font-size:clamp(2rem,6vw,3.5rem);line-height:1.1}a{color:#9fd3ff;text-underline-offset:3px}p{max-width:80ch}.notice{padding:16px 20px;border-inline-start:4px solid #edbb59;background:#172638;border-radius:6px}table{width:100%;border-collapse:collapse;margin:28px 0;text-align:start}th,td{padding:15px 18px;border-bottom:1px solid #304158;text-align:start}thead{background:#1b2c40}tbody th{font-weight:600}tbody tr:hover{background:#122238}.scroll{overflow-x:auto}footer{color:#aebed0;font-size:.9rem}noscript{display:block;padding:20px}
  </style>
  <script src="./support-notice.js" defer></script>
</head>
<body><main>
  <a href="./">← ChimpiBlender Online</a>
  <h1 data-i18n="table">Apps and support</h1>
  <p class="notice" data-i18n="intro">Versions below those listed lose security support on 4 November 2026 at 00:00 UTC</p>
  <p data-i18n="legacy">Already installed versions without an update checker need a manual update</p>
  <div class="scroll"><table>
    <thead><tr><th scope="col" data-i18n="app">App / website</th><th scope="col" data-i18n="available">Available version</th><th scope="col" data-i18n="support">Support / action</th></tr></thead>
    <tbody id="apps"></tbody>
  </table></div>
  <noscript>JavaScript is needed for the translated table — <a href="./support-policy.json">view the version catalog</a></noscript>
  <footer id="catalog-footer"></footer>
</main><script>document.addEventListener('DOMContentLoaded',()=>ChimpiSupport.renderTable(document.getElementById('apps')))</script></body>
</html>
